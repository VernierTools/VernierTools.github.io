<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every Nth line — Vernier</title>
<script>(function(){try{var m=localStorage.getItem('tb.theme');var d=m?m==='dark':matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>
<link rel="stylesheet" href="../../shared/shell.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/shared/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/shared/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5457E5">
<style>
  .ta{ box-sizing:border-box; width:100%; min-height:240px; resize:vertical; margin:0;
    font-family:var(--font-sans); font-size:14px; line-height:1.7; padding:10px 12px;
    border:1px solid var(--border-strong); border-radius:var(--r); background:var(--surface); color:var(--text);
    transition:border-color var(--tap), box-shadow var(--tap); }
  .ta:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-ring); }
  .ta::placeholder{ color:var(--text-3); }
  .ta[readonly]{ background:var(--surface-2); }
  .cardhead{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); margin-bottom:var(--s3); }
  .cardhead .label{ margin:0; }
  .pick{ font-size:12px; color:var(--text-3); line-height:1.5; margin-top:var(--s3); font-variant-numeric:tabular-nums; }
  .settings{ margin-bottom:var(--s4); }
  .settings .toggle{ display:flex; margin-top:var(--s2); }
</style>
</head>
<body>
<main class="shell">
  <div class="toolhead">
    <div class="chips"><span class="chip" data-i18n="cat.text">Text</span></div>
    <h1 data-i18n="t.title">Every Nth line</h1>
    <p data-i18n="t.desc">Take every Nth line of a text, such as lines 1, 4, 7… for every 3rd line.</p>
  </div>

  <div class="work">
    <!-- 左: 入力 -->
    <div>
      <div class="card">
        <div class="cardhead">
          <label class="label" for="ta-in" data-i18n="t.input">Text</label>
          <span class="badge badge--muted" id="in-count">0</span>
        </div>
        <textarea id="ta-in" class="ta" rows="14" spellcheck="false" data-i18n-ph="t.inputPh"></textarea>
        <div class="btnrow">
          <button class="btn btn--ghost" id="btn-clear" type="button" data-i18n="t.clear">Clear</button>
        </div>
      </div>
    </div>

    <!-- 右: 設定と結果 -->
    <div>
      <div class="card settings">
        <div class="row2">
          <div class="field">
            <label class="label" for="every" data-i18n="t.every">Every N lines</label>
            <input class="input" id="every" type="number" min="1" step="1" inputmode="numeric">
          </div>
          <div class="field">
            <label class="label" for="start" data-i18n="t.start">Start at line</label>
            <input class="input" id="start" type="number" min="1" step="1" inputmode="numeric">
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="skip-blank">
          <span class="track"></span>
          <span data-i18n="t.skipBlank">Don't count blank lines</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="invert">
          <span class="track"></span>
          <span data-i18n="t.invert">Keep the other lines instead</span>
        </label>
        <div class="pick" id="pick"></div>
        <div class="badge badge--neg" id="err" hidden style="margin-top:var(--s3)"></div>
      </div>

      <div class="card">
        <div class="cardhead">
          <label class="label" for="ta-out" data-i18n="t.output">Result</label>
          <span class="badge badge--muted" id="out-count">0</span>
        </div>
        <textarea id="ta-out" class="ta" rows="10" readonly spellcheck="false"></textarea>
        <div class="btnrow">
          <button class="btn btn--primary" id="btn-copy" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
            <span data-i18n="t.copy">Copy result</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="../../shared/shell.js"></script>
<script>
"use strict";
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "enl.settings";   // 設定だけ覚える（文章は保存しない）
  var taIn = $("ta-in"), taOut = $("ta-out");

  function T(key) { return (window.Shell && Shell.t) ? Shell.t(key) : key; }
  function fill(str, vals) { return str.replace(/\{(\w+)\}/g, function (_, k) { return vals[k]; }); }

  function load() {
    var s = { every: "3", start: "1", skipBlank: false, invert: false };
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "{}");
      if (typeof o.every === "string") s.every = o.every;
      if (typeof o.start === "string") s.start = o.start;
      s.skipBlank = !!o.skipBlank;
      s.invert = !!o.invert;
    } catch (e) { /* 既定値のまま */ }
    $("every").value = s.every;
    $("start").value = s.start;
    $("skip-blank").checked = s.skipBlank;
    $("invert").checked = s.invert;
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ every: $("every").value, start: $("start").value,
        skipBlank: $("skip-blank").checked, invert: $("invert").checked }));
    } catch (e) { /* 保存できなくても使える */ }
  }

  function splitLines(text) {
    if (text === "") return [];
    var lines = text.split(/\r\n|\r|\n/);
    if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();   // 末尾の改行は行を増やさない
    return lines;
  }

  function render() {
    var every = Number($("every").value), start = Number($("start").value);
    var skipBlank = $("skip-blank").checked, invert = $("invert").checked;
    var err = "";
    if (!(every >= 1) || every !== Math.floor(every)) err = "t.e.every";
    else if (!(start >= 1) || start !== Math.floor(start)) err = "t.e.start";
    $("err").hidden = !err;
    $("err").textContent = err ? T(err) : "";

    var lines = splitLines(taIn.value);
    $("in-count").textContent = fill(T("t.nlines"), { n: lines.length });
    if (err) {
      taOut.value = "";
      $("out-count").textContent = fill(T("t.nlines"), { n: 0 });
      $("pick").textContent = "";
      return;
    }

    // 数える行の番号 k（1 から）が start, start+every, … のものを選ぶ。空行を数えないときは、空行は数えず結果にも入れない
    var out = [], k = 0, picked = [];
    lines.forEach(function (line) {
      if (skipBlank && line.trim() === "") return;
      k++;
      var hit = k >= start && (k - start) % every === 0;
      if (hit && picked.length < 4) picked.push(k);
      if (hit !== invert) out.push(line);
    });
    taOut.value = out.join("\n");
    $("out-count").textContent = fill(T("t.nlines"), { n: out.length });

    // 選ぶ行の番号の例（入力が短くても規則がわかるように、文章の長さに関係なく出す）
    var ex = [start, start + every, start + every * 2].join(", ") + ", …";
    $("pick").textContent = fill(T(invert ? "t.pickInv" : "t.pick"), { list: ex }) + (skipBlank ? T("t.pickBlank") : "");
  }

  if (typeof Shell !== "undefined" && Shell && typeof Shell.init === "function") {
    Shell.init({
      id: "every-nth-line",
      strings: {
        en: {
          "t.title": "Every Nth line",
          "t.desc": "Take every Nth line of a text, such as lines 1, 4, 7… for every 3rd line.",
          "t.input": "Text", "t.inputPh": "Paste or type text here", "t.clear": "Clear",
          "t.every": "Every N lines", "t.start": "Start at line",
          "t.skipBlank": "Don't count blank lines", "t.invert": "Keep the other lines instead",
          "t.pick": "Takes lines {list}", "t.pickInv": "Removes lines {list} and keeps the rest",
          "t.pickBlank": " (blank lines are skipped and dropped)",
          "t.output": "Result", "t.copy": "Copy result", "t.nlines": "{n} lines",
          "t.e.every": "Enter a whole number of 1 or more for the interval.",
          "t.e.start": "Enter a whole number of 1 or more for the start line."
        },
        ja: {
          "t.title": "N行ごとに抽出",
          "t.desc": "文章から N 行ごとに行を抜き出します。3 行ごとなら 1, 4, 7… 行目です。",
          "t.input": "文章", "t.inputPh": "ここに文章を貼り付けるか、入力します", "t.clear": "クリア",
          "t.every": "何行ごと", "t.start": "開始する行",
          "t.skipBlank": "空行を数えない", "t.invert": "選んだ行以外を残す",
          "t.pick": "{list} 行目を抜き出します", "t.pickInv": "{list} 行目を除いて、残りを出します",
          "t.pickBlank": "（空行は数えず、結果にも入れません）",
          "t.output": "結果", "t.copy": "結果をコピー", "t.nlines": "{n} 行",
          "t.e.every": "間隔は 1 以上の整数にしてください。",
          "t.e.start": "開始する行は 1 以上の整数にしてください。"
        }
      },
      onSettingsChange: render
    });
  }

  load();
  taIn.addEventListener("input", render);
  ["every", "start"].forEach(function (id) { $(id).addEventListener("input", function () { save(); render(); }); });
  ["skip-blank", "invert"].forEach(function (id) { $(id).addEventListener("change", function () { save(); render(); }); });
  $("btn-clear").addEventListener("click", function () { taIn.value = ""; render(); taIn.focus(); });
  $("btn-copy").addEventListener("click", function () {
    if (window.Shell && Shell.copy) Shell.copy(taOut.value, $("btn-copy"));
  });
  render();
})();
</script>
</body>
</html>
