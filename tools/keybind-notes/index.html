<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numpad shortcut notes — Vernier</title>
<script>(function(){try{var m=localStorage.getItem('tb.theme');var d=m?m==='dark':matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>
<link rel="stylesheet" href="../../shared/shell.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/shared/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/shared/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5457E5">
<style>
  /* ---- 共通の小物（セグメント・グループ） ---- */
  .seg{ display:inline-flex; padding:2px; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; }
  .seg button{ appearance:none; border:0; background:transparent; font:inherit; font-size:12.5px; color:var(--text-2);
    padding:5px 12px; border-radius:7px; cursor:pointer; white-space:nowrap; transition:background var(--tap), color var(--tap); }
  .seg button[aria-pressed="true"]{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm); font-weight:500; }
  .seg button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .group{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; }
  .group + .group, .ghead + .group{ margin-top:var(--s2); }
  .ghead{ font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-3); margin:var(--s5) 4px 0; }
  .ghead:first-child{ margin-top:0; }
  .grow{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); padding:11px 14px; min-height:48px; }
  .grow + .grow{ border-top:1px solid var(--border); }
  .grow > .lbl{ font-size:13px; color:var(--text); flex:none; }
  .grow.col{ flex-direction:column; align-items:stretch; gap:8px; }
  .grow.col > .lbl{ color:var(--text-2); font-size:12.5px; }
  .grow .input, .grow .select{ height:34px; }
  .sub{ font-size:12px; color:var(--text-3); line-height:1.55; }
  .ibtn{ appearance:none; width:32px; height:32px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface);
    color:var(--text-2); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0; flex:none; font:inherit; }
  .ibtn:hover{ color:var(--text); background:var(--surface-2); }
  .ibtn:disabled{ opacity:.4; cursor:default; }
  .ibtn svg{ width:16px; height:16px; }
  .linkbtn{ appearance:none; border:0; background:none; padding:0; font:inherit; font-size:13px; color:var(--accent); cursor:pointer; }
  .linkbtn.danger{ color:var(--neg); }
  .linkbtn:disabled{ color:var(--text-3); cursor:default; }
  .stepper{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:13px; }
  .stepper span{ min-width:1.4em; text-align:center; }

  /* ---- ステージ（ソフトの切り替え・本体） ---- */
  .stage{ padding:0; overflow:hidden; }
  .apps{ display:flex; gap:6px; overflow-x:auto; padding:14px 16px 12px; border-bottom:1px solid var(--border); scrollbar-width:thin; }
  .app{ appearance:none; flex:none; display:inline-flex; align-items:center; gap:8px; font:inherit; font-size:13px; color:var(--text-2);
    background:transparent; border:1px solid transparent; border-radius:10px; padding:5px 12px 5px 5px; cursor:pointer; max-width:200px; }
  .app:hover{ background:var(--surface-2); }
  .app[aria-selected="true"]{ background:var(--surface-2); border-color:var(--border-strong); color:var(--text); font-weight:500; }
  .app .av{ width:26px; height:26px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; color:#fff;
    font-size:12px; font-weight:700; flex:none; }
  .app .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .app.add{ padding:5px 10px; color:var(--text-3); border:1px dashed var(--border-strong); }
  .bar{ display:flex; align-items:center; justify-content:space-between; gap:var(--s2); flex-wrap:wrap; padding:12px 16px 0; }
  .layerwrap{ position:relative; display:flex; align-items:center; gap:6px; }
  .menu{ position:absolute; top:calc(100% + 6px); left:0; z-index:20; min-width:180px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; box-shadow:var(--shadow-md); padding:4px; }
  .menu button{ display:block; width:100%; text-align:left; appearance:none; border:0; background:none; font:inherit; font-size:13px;
    color:var(--text); padding:7px 10px; border-radius:6px; cursor:pointer; }
  .menu button:hover, .menu button:focus-visible{ background:var(--surface-2); outline:none; }
  .menu button.danger{ color:var(--neg); }
  .menu hr{ border:0; border-top:1px solid var(--border); margin:4px 2px; }
  .editbtn{ display:inline-flex; align-items:center; gap:6px; height:34px; font-size:13px; }
  .editbtn svg{ width:14px; height:14px; }
  .editbtn[aria-pressed="true"]{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .stagearea{ display:flex; justify-content:center; padding:28px 16px 18px;
    background:radial-gradient(120% 90% at 50% 0%, var(--surface) 0%, var(--surface-2) 70%); }
  .hint{ font-size:12px; color:var(--text-3); line-height:1.6; text-align:center; padding:0 16px 16px; }

  /* ---- 本体とキーキャップ ---- */
  .device{ --u:72px; --g:10px; position:relative; padding:18px; border-radius:26px;
    box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 28px 50px -24px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.12); }
  .device.dark{ background:linear-gradient(160deg, #3a3c42 0%, #26272c 55%, #1f2024 100%); }
  .device.light{ background:linear-gradient(160deg, #f3f4f6 0%, #e2e4e8 60%, #d6d9de 100%); box-shadow:0 1px 0 #fff inset, 0 28px 50px -24px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.08); }
  .pad{ display:grid; grid-template-columns:repeat(var(--cols), var(--u)); grid-auto-rows:var(--u); gap:var(--g); }
  .cap{ --kc:transparent; position:relative; appearance:none; font:inherit; text-align:center; cursor:pointer; padding:0; border:0;
    border-radius:14px; display:flex; align-items:center; justify-content:center; overflow:visible;
    transition:transform 90ms ease, box-shadow 120ms ease; touch-action:manipulation; }
  .device.round .cap{ border-radius:999px; }
  .device.dark .cap{ color:#f4f4f6;
    background:linear-gradient(180deg, color-mix(in srgb, var(--kc) 34%, #45474d), color-mix(in srgb, var(--kc) 30%, #303237));
    box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 -2px 0 rgba(0,0,0,.25) inset, 0 3px 0 #151619, 0 5px 10px rgba(0,0,0,.35); }
  .device.light .cap{ color:#1d1d1f;
    background:linear-gradient(180deg, color-mix(in srgb, var(--kc) 22%, #ffffff), color-mix(in srgb, var(--kc) 26%, #f1f2f4));
    box-shadow:0 1px 0 #fff inset, 0 -2px 0 rgba(0,0,0,.06) inset, 0 3px 0 #b9bdc5, 0 5px 10px rgba(0,0,0,.12); }
  .cap.has-c::after{ content:""; position:absolute; left:50%; bottom:7px; width:18px; height:3px; margin-left:-9px; border-radius:2px; background:var(--kc); opacity:.95; }
  .cap:hover{ transform:translateY(-1px); }
  .cap.is-hit{ transform:translateY(2px); }
  .cap.is-sel{ outline:2.5px solid var(--accent); outline-offset:3px; }
  .cap:focus-visible{ outline:2.5px solid var(--accent); outline-offset:3px; }
  .cap .lg{ position:absolute; top:8px; left:0; right:0; font-family:var(--font-mono); font-size:10.5px; opacity:.55; line-height:1; }
  .device.round .cap .lg{ top:9px; }
  .cap .tx{ font-size:var(--fs, 11.5px); font-weight:600; line-height:1.25; padding:14px 7px 6px; word-break:break-word; line-break:strict; white-space:pre-line;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .device.round .cap .tx{ padding-left:10px; padding-right:10px; }
  .cap .tx:empty{ display:none; }
  .device.small .cap.has-t .lg{ font-size:9px; top:6px; }
  .device.small .cap .tx{ padding:10px 4px 4px; line-height:1.18; }
  .device.small.round .cap .tx{ padding-left:7px; padding-right:7px; }
  .device.small .cap.has-c::after{ bottom:4px; width:12px; margin-left:-6px; height:2px; }
  .cap:not(.has-t) .lg{ position:static; font-size:14px; opacity:.85; font-family:var(--font-sans); font-weight:500; }
  /* 編集モード */
  .device.editing .cap{ cursor:grab; touch-action:none; }
  .device.editing .cap.is-drag{ cursor:grabbing; z-index:5; transform:scale(1.04); }
  .slot{ appearance:none; border:1.5px dashed rgba(128,128,140,.45); background:transparent; border-radius:14px; cursor:pointer; color:rgba(128,128,140,.7);
    font-size:18px; display:flex; align-items:center; justify-content:center; }
  .device.round .slot{ border-radius:999px; }
  .slot:hover{ border-color:var(--accent); color:var(--accent); }
  .rs{ position:absolute; right:-6px; bottom:-6px; width:18px; height:18px; border-radius:50%; background:var(--accent); border:2px solid #fff;
    box-shadow:0 1px 3px rgba(0,0,0,.35); cursor:nwse-resize; touch-action:none; z-index:6; }

  /* ---- 右パネル ---- */
  .keyhead{ display:flex; align-items:center; gap:12px; min-width:0; }
  .keychip{ min-width:44px; height:44px; padding:0 10px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; flex:none;
    font-family:var(--font-mono); font-size:15px; font-weight:600; background:var(--surface-2); border:1px solid var(--border-strong); }
  .keyhead .t1{ font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .keyhead .t2{ font-size:12px; color:var(--text-3); margin-top:1px; }
  textarea.input{ height:auto; min-height:62px; padding:8px 12px; resize:vertical; line-height:1.45; }
  .swatches{ display:flex; flex-wrap:wrap; gap:8px; }
  .swatches button{ width:26px; height:26px; border-radius:50%; cursor:pointer; border:0; padding:0; box-shadow:0 0 0 1px rgba(0,0,0,.12) inset; }
  .swatches button[aria-pressed="true"]{ box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .swatches button.none{ background:linear-gradient(135deg, transparent 44%, var(--neg) 44%, var(--neg) 56%, transparent 56%), var(--surface-2); box-shadow:0 0 0 1px var(--border-strong) inset; }
  .capture.is-on{ font-weight:600; }
  .preview{ display:block; width:100%; max-width:360px; height:auto; margin:0 auto; border-radius:10px; border:1px solid var(--border); }
  .btns{ display:flex; gap:var(--s2); flex-wrap:wrap; }
  .btns .btn{ flex:1; min-width:120px; }
  .msg{ font-size:12px; }
  .msg:empty{ display:none; }
  .msg.warn{ color:var(--neg); } .msg.ok{ color:var(--text-3); }
  #inspector{ scroll-margin-top:88px; }
  .work > div{ min-width:0; }
  .stagearea{ overflow:hidden; }
</style>
</head>
<body>
<main class="shell">
  <div class="toolhead">
    <div class="chips"><span class="chip" data-i18n="cat.general">General</span></div>
    <h1 data-i18n="t.title">Numpad shortcut notes</h1>
    <p data-i18n="t.desc">Using a numpad as a left-hand device? Note what each key does in each app, and save the layout as an image to paste into your notes.</p>
  </div>

  <div class="work work--wide">
    <!-- 左: ソフトの切り替えと本体 -->
    <div>
      <div class="card stage">
        <div class="apps" id="apps" role="tablist" aria-label="Apps"></div>
        <div class="bar">
          <div class="layerwrap">
            <div class="seg" id="layers" role="group"></div>
            <button type="button" class="ibtn" id="layer-menu-btn" aria-haspopup="true" aria-expanded="false" data-i18n-title="t.layerMenu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
            <div class="menu" id="layer-menu" hidden></div>
          </div>
          <button type="button" class="btn btn--secondary editbtn" id="edit" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 14v7M14 17.5h7"/></svg>
            <span id="edit-label"></span></button>
        </div>
        <div class="stagearea" id="stagearea">
          <div class="device" id="device"><div class="pad" id="pad" aria-label="Numpad"></div></div>
        </div>
        <div class="hint" id="hint"></div>
      </div>
    </div>

    <!-- 右: 設定 -->
    <div id="inspector"></div>
  </div>
</main>
<script src="../../shared/shell.js"></script>
<script>
"use strict";
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var STORE = "vernier.keybind";
  var MAXC = 6, MAXR = 8;

  /* =====================================================================
     プリセット配列  [id, 刻印, 列, 行, 幅, 高さ]
     id は実機のキー（KeyboardEvent.code）と同じ。電卓キーだけは code が別（LaunchApp2）
     ===================================================================== */
  var NUM = [
    ["Numpad7", "7"], ["Numpad8", "8"], ["Numpad9", "9"], ["Numpad4", "4"], ["Numpad5", "5"], ["Numpad6", "6"],
    ["Numpad1", "1"], ["Numpad2", "2"], ["Numpad3", "3"]
  ];
  function digits(r0) { return NUM.map(function (k, i) { return [k[0], k[1], i % 3, r0 + Math.floor(i / 3), 1, 1]; }); }
  var PRESETS = {
    "17": [["NumLock", "Num", 0, 0, 1, 1], ["NumpadDivide", "/", 1, 0, 1, 1], ["NumpadMultiply", "*", 2, 0, 1, 1], ["NumpadSubtract", "−", 3, 0, 1, 1]]
      .concat(digits(1), [["NumpadAdd", "+", 3, 1, 1, 2], ["NumpadEnter", "Enter", 3, 3, 1, 2], ["Numpad0", "0", 0, 4, 2, 1], ["NumpadDecimal", ".", 2, 4, 1, 1]]),
    "21": [["Escape", "Esc", 0, 0, 1, 1], ["Tab", "Tab", 1, 0, 1, 1], ["NumpadEqual", "=", 2, 0, 1, 1], ["Backspace", "⌫", 3, 0, 1, 1],
      ["NumLock", "Num", 0, 1, 1, 1], ["NumpadDivide", "/", 1, 1, 1, 1], ["NumpadMultiply", "*", 2, 1, 1, 1], ["NumpadSubtract", "−", 3, 1, 1, 1]]
      .concat(digits(2), [["NumpadAdd", "+", 3, 2, 1, 2], ["NumpadEnter", "Enter", 3, 4, 1, 2], ["Numpad0", "0", 0, 5, 2, 1], ["NumpadDecimal", ".", 2, 5, 1, 1]]),
    "22": [["Escape", "Esc", 0, 0, 1, 1], ["Calc", "Calc", 1, 0, 1, 1], ["Tab", "Tab", 2, 0, 1, 1], ["NumpadEqual", "=", 3, 0, 1, 1],
      ["NumLock", "Num", 0, 1, 1, 1], ["NumpadDivide", "/", 1, 1, 1, 1], ["NumpadMultiply", "*", 2, 1, 1, 1], ["Backspace", "⌫", 3, 1, 1, 1]]
      .concat(digits(2), [["NumpadSubtract", "−", 3, 2, 1, 1], ["NumpadAdd", "+", 3, 3, 1, 1], ["NumpadEnter", "Enter", 3, 4, 1, 2],
        ["Numpad0", "0", 0, 5, 2, 1], ["NumpadDecimal", ".", 2, 5, 1, 1]])
  };
  var CODE = { Calc: "LaunchApp2" };
  function makeKeys(p) { return PRESETS[p].map(function (k) { return { id: k[0], lg: k[1], code: CODE[k[0]] || k[0], c: k[2], r: k[3], w: k[4], h: k[5] }; }); }
  var COLORS = [null, "#FF453A", "#FF9F0A", "#FFD60A", "#30D158", "#64D2FF", "#0A84FF", "#BF5AF2", "#FF375F", "#98989D"];
  var MODS = ["shift", "ctrl", "alt", "meta"];
  var MODNAME = { shift: "Shift", ctrl: "Ctrl", alt: "Alt", meta: "Cmd" };
  var AVC = ["#0A84FF", "#30B0C7", "#34C759", "#FF9500", "#FF2D55", "#AF52DE", "#5856D6", "#A2845E"];

  /* =====================================================================
     データ（localStorage）
       { v:2, device:{preset, shape, color, keys:[{id, lg, code, c, r, w, h}]},
         active, profiles:[{id, name, layers:[{id, mod, name, map:{keyId:{t, c}}}]}], exported, changed }
     ===================================================================== */
  function uid() { return Math.random().toString(36).slice(2, 10); }
  var D = null;
  function validProfiles(s) { return s && Array.isArray(s.profiles) && s.profiles.length && s.profiles.every(function (p) { return p && Array.isArray(p.layers) && p.layers.length; }); }
  // 旧形式（v1: device.type = "17" / "21"、上段は X1〜X4）を v2 に移す
  var OLDTOP = { X1: "Escape", X2: "Tab", X3: "NumpadEqual", X4: "Backspace" };
  function migrate(s) {
    if (!validProfiles(s) || !s.device) return null;
    if (s.v === 2 && Array.isArray(s.device.keys) && s.device.keys.length) return s;
    var type = s.device.type === "21" ? "21" : "17", keys = makeKeys(type), leg = s.device.legends || {}, codes = s.device.codes || {};
    Object.keys(OLDTOP).forEach(function (x) {
      var k = keys.filter(function (q) { return q.id === OLDTOP[x]; })[0];
      if (k) { if (leg[x]) k.lg = leg[x]; if (codes[x]) k.code = codes[x]; }
    });
    keys.forEach(function (k) { if (!OLDTOP[k.id] && leg[k.id]) k.lg = leg[k.id]; });
    s.profiles.forEach(function (p) { p.layers.forEach(function (l) {
      l.map = l.map || {};
      Object.keys(OLDTOP).forEach(function (x) { if (l.map[x]) { l.map[OLDTOP[x]] = l.map[x]; delete l.map[x]; } });
    }); });
    s.v = 2; s.device = { preset: type, shape: "square", color: "dark", keys: keys };
    return s;
  }
  function sample() {
    return { id: uid(), name: Shell.t("t.sampleName"), layers: [{ id: uid(), mod: "", name: "", map: {
      Numpad0: { t: Shell.t("t.s0"), c: 4 }, Numpad1: { t: Shell.t("t.s1"), c: 6 }, Numpad2: { t: Shell.t("t.s2"), c: 6 }, Numpad4: { t: Shell.t("t.s4"), c: 2 } } }] };
  }
  function save(changed) {
    if (changed !== false) D.changed = Date.now();
    try { localStorage.setItem(STORE, JSON.stringify(D)); } catch (e) {}
  }
  var S = { layer: null, key: "Numpad5", edit: false, capture: false, img: "cur", bg: "light", menu: false };
  function prof() { return D.profiles.filter(function (p) { return p.id === D.active; })[0] || D.profiles[0]; }
  function layer() { var p = prof(); return p.layers.filter(function (l) { return l.id === S.layer; })[0] || p.layers[0]; }
  function layerName(l) { return l.mod ? MODNAME[l.mod] : l.name || Shell.t("t.base"); }
  function keys() { return D.device.keys; }
  function keyById(id) { return keys().filter(function (k) { return k.id === id; })[0]; }
  function dims() {
    var c = 1, r = 1;
    keys().forEach(function (k) { c = Math.max(c, k.c + k.w); r = Math.max(r, k.r + k.h); });
    return { c: c, r: r };
  }

  /* ---- 配置の検査 ---- */
  function fits(id, c, r, w, h) {
    if (c < 0 || r < 0 || w < 1 || h < 1 || c + w > MAXC || r + h > MAXR) return false;
    return keys().every(function (k) {
      if (k.id === id) return true;
      return c + w <= k.c || k.c + k.w <= c || r + h <= k.r || k.r + k.h <= r;
    });
  }
  function normalize() {
    var mc = Infinity, mr = Infinity;
    keys().forEach(function (k) { mc = Math.min(mc, k.c); mr = Math.min(mr, k.r); });
    if (!keys().length || (!mc && !mr)) return;
    keys().forEach(function (k) { k.c -= mc; k.r -= mr; });
  }

  /* =====================================================================
     描画: ソフト・レイヤー
     ===================================================================== */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function avatar(p) {
    var n = p.name || "?", h = 0;
    for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
    return { ch: (Array.from(n.trim())[0] || "?").toUpperCase(), col: AVC[h % AVC.length] };
  }
  function renderApps() {
    var cur = prof().id;
    $("apps").innerHTML = D.profiles.map(function (p) {
      var a = avatar(p);
      return '<button type="button" class="app" role="tab" data-p="' + p.id + '" aria-selected="' + (p.id === cur) + '">' +
        '<span class="av" style="background:' + a.col + '">' + esc(a.ch) + '</span><span class="nm">' + esc(p.name || Shell.t("t.untitled")) + "</span></button>";
    }).join("") + '<button type="button" class="app add" id="app-add">＋ ' + Shell.t("t.pAdd") + "</button>";
  }
  function renderLayers() {
    var cur = layer();
    $("layers").innerHTML = prof().layers.map(function (l) {
      return '<button type="button" data-l="' + l.id + '" aria-pressed="' + (l.id === cur.id) + '">' + esc(layerName(l)) + "</button>";
    }).join("");
    var used = prof().layers.map(function (l) { return l.mod; });
    var html = MODS.filter(function (m) { return used.indexOf(m) < 0; }).map(function (m) {
      return '<button type="button" data-add="' + m + '">' + Shell.t("t.addLayer").replace("{m}", MODNAME[m]) + "</button>";
    }).join("");

    if (moved) commitLayout(); else renderPad();
  }
  $("pad").addEventListener("pointerup", endDrag);
  $("pad").addEventListener("pointercancel", endDrag);
  $("pad").addEventListener("click", function (ev) {
    var slot = ev.target.closest(".slot");
    if (slot) {
      var p = slot.getAttribute("data-slot").split(",").map(Number), id = "K" + uid();
      keys().push({ id: id, lg: "", code: "", c: p[0], r: p[1], w: 1, h: 1 });
      S.key = id; S.capture = true; commitLayout();                  // 追加したら、そのまま実機のキーを待つ
      return;
    }
    if (S.edit) return;
    var cap = ev.target.closest(".cap"); if (!cap) return;
    selectKey(cap.getAttribute("data-k"));
    if (window.matchMedia("(max-width:760px)").matches) $("inspector").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  // ---- 実機のキー ----
  document.addEventListener("keydown", function (e) {
    var t = e.target, tag = t && t.tagName;
    if (S.capture) {
      if (["Shift", "Control", "Alt", "Meta"].indexOf(e.key) >= 0) return;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      e.preventDefault();
      var k = keyById(S.key);
      if (k) { k.code = e.code || e.key; if (!k.lg) k.lg = guessLegend(e); D.device.preset = "custom"; save(); }
      S.capture = false; renderPad(); renderInspector(); return;
    }
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) return;
    if (S.edit && /^Arrow/.test(e.code) && keyById(S.key)) {       // 編集中: 矢印キーで移動
      e.preventDefault(); moveKey(e.code === "ArrowLeft" ? "c-1" : e.code === "ArrowRight" ? "c+1" : e.code === "ArrowUp" ? "r-1" : "r+1"); return;
    }
    var hit = keys().filter(function (k) { return k.code && (k.code === e.code || (k.code === "NumpadEqual" && e.code === "Equal")); })[0];
    if (!hit) return;
    if (e.code === "Tab" && t !== document.body) return;            // フォーカス移動の Tab は奪わない
    e.preventDefault();
    var want = e.shiftKey ? "shift" : e.ctrlKey ? "ctrl" : e.altKey ? "alt" : e.metaKey ? "meta" : "";
    var l = prof().layers.filter(function (x) { return x.mod === want; })[0];
    if (!S.edit && l && l.id !== layer().id) { S.layer = l.id; renderLayers(); renderPad(); }
    selectKey(hit.id, true);
  });
  function guessLegend(e) {
    var k = e.key || "";
    var names = { Escape: "Esc", Backspace: "⌫", Enter: "Enter", Tab: "Tab", " ": "Space", Delete: "Del" };
    if (names[k]) return names[k];
    if (/^Numpad\d$/.test(e.code)) return e.code.slice(6);
    return k.length <= 4 ? k.toUpperCase() : k.slice(0, 5);
  }
  function moveKey(m) {
    var k = keyById(S.key); if (!k) return;
    var ax = m.charAt(0), d = +m.slice(1);
    var nc = k.c + (ax === "c" ? d : 0), nr = k.r + (ax === "r" ? d : 0);
    if (fits(k.id, nc, nr, k.w, k.h)) { k.c = nc; k.r = nr; commitLayout(); }
  }

  // ---- ソフト・レイヤー ----
  $("apps").addEventListener("click", function (e) {
    var b = e.target.closest(".app"); if (!b) return;
    if (b.id === "app-add") {
      var p = { id: uid(), name: Shell.t("t.newApp"), layers: [{ id: uid(), mod: "", name: "", map: {} }] };
      D.profiles.push(p); D.active = p.id; S.layer = null; S.edit = false; save(); renderAll();
      $("pname").focus(); $("pname").select(); return;
    }
    D.active = b.getAttribute("data-p"); S.layer = null; save(false); renderAll();
  });
  $("layers").addEventListener("click", function (e) {
    var b = e.target.closest("[data-l]"); if (!b) return;
    S.layer = b.getAttribute("data-l"); renderLayers(); renderPad(); renderInspector();
  });
  $("layer-menu-btn").addEventListener("click", function (e) { e.stopPropagation(); S.menu = !S.menu; renderLayers(); });
  document.addEventListener("click", function (e) { if (S.menu && !e.target.closest(".layerwrap")) { S.menu = false; renderLayers(); } });
  $("layer-menu").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var p = prof();
    if (b.hasAttribute("data-add")) {
      var l = { id: uid(), mod: b.getAttribute("data-add"), name: "", map: {} }, order = [""].concat(MODS);
      p.layers.push(l); p.layers.sort(function (a, c) { return order.indexOf(a.mod) - order.indexOf(c.mod); });
      S.layer = l.id; save();
    } else if (b.hasAttribute("data-rm")) {
      var cur = layer();
      if (Object.keys(cur.map).length && !confirm(Shell.t("t.confirmRmLayer").replace("{n}", layerName(cur)))) return;
      p.layers = p.layers.filter(function (x) { return x.id !== cur.id; }); S.layer = null; save();
    }
    S.menu = false; renderLayers(); renderPad(); renderInspector();
  });
  $("edit").addEventListener("click", function () { S.edit = !S.edit; S.capture = false; S.menu = false; renderAll(); });

  // ---- 右パネル（中身を描き直すので委譲で受ける） ----
  var insp = $("inspector");
  insp.addEventListener("input", function (e) {
    var id = e.target.id, v = e.target.value;
    if (id === "ktext") setEntry(function (x) { x.t = v; });
    else if (id === "klegend") {
      var k = keyById(S.key); k.lg = v.trim(); save(); renderPad();
      document.querySelector(".keychip").textContent = k.lg || "?"; schedulePreview();
    } else if (id === "pname") {
      prof().name = v; save();
      var chip = document.querySelector('.app[data-p="' + prof().id + '"]');
      if (chip) { var a = avatar(prof()); chip.querySelector(".nm").textContent = v || Shell.t("t.untitled"); chip.querySelector(".av").textContent = a.ch; chip.querySelector(".av").style.background = a.col; }
      schedulePreview();
    }
  });
  insp.addEventListener("change", function (e) {
    if (e.target.id === "preset" && e.target.value) {
      var p = e.target.value;
      if (!confirm(Shell.t("t.confirmPreset"))) { e.target.value = ""; return; }
      D.device.keys = makeKeys(p); D.device.preset = p; S.key = "Numpad5"; save(); renderPad(); renderInspector();
    }
    if (e.target.id === "impfile") {
      var f = e.target.files[0]; if (!f) return;
      f.text().then(function (txt) {
        var n = importData(JSON.parse(txt)); save(); renderAll();
        $("bkmsg").className = "msg ok"; $("bkmsg").textContent = Shell.t("t.imported").replace("{n}", n);
      }).catch(function () { $("bkmsg").className = "msg warn"; $("bkmsg").textContent = Shell.t("t.importFail"); });
    }
  });
  insp.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var sg = b.closest(".seg");
    if (sg && b.hasAttribute("data-v")) {
      var v = b.getAttribute("data-v");
      if (sg.id === "shape") D.device.shape = v;
      else if (sg.id === "dcolor") D.device.color = v;
      else if (sg.id === "img-what") S.img = v;
      else if (sg.id === "img-bg") S.bg = v;
      if (sg.id === "shape" || sg.id === "dcolor") save(); else try { localStorage.setItem(STORE + ".img", JSON.stringify({ img: S.img, bg: S.bg })); } catch (err) {}
      sg.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      renderPad(); schedulePreview(); return;
    }
    if (b.hasAttribute("data-c")) { var c = +b.getAttribute("data-c"); setEntry(function (x) { x.c = c; }); renderInspector(); return; }
    if (b.hasAttribute("data-sz")) {
      var k = keyById(S.key), m = b.getAttribute("data-sz"), nw = k.w + (m.charAt(0) === "w" ? +m.slice(1) : 0), nh = k.h + (m.charAt(0) === "h" ? +m.slice(1) : 0);
      if (nw <= 4 && nh <= 4 && fits(k.id, k.c, k.r, nw, nh)) { k.w = nw; k.h = nh; commitLayout(); }
      return;
    }
    if (b.hasAttribute("data-mv")) { moveKey(b.getAttribute("data-mv")); return; }
    switch (b.id) {
      case "capture": S.capture = !S.capture; renderInspector(); break;
      case "kdel":
        if (keys().length < 2) return;
        D.device.keys = keys().filter(function (k) { return k.id !== S.key; }); S.key = keys()[0].id; commitLayout(); break;
      case "p-dup":
        var p = JSON.parse(JSON.stringify(prof())); p.id = uid(); p.name = p.name + Shell.t("t.copySuffix");
        p.layers.forEach(function (l) { l.id = uid(); }); D.profiles.push(p); D.active = p.id; S.layer = null; save(); renderAll(); break;
      case "p-del":
        if (D.profiles.length < 2 || !confirm(Shell.t("t.confirmDel").replace("{n}", prof().name || Shell.t("t.untitled")))) return;
        D.profiles = D.profiles.filter(function (q) { return q.id !== D.active; }); D.active = D.profiles[0].id; S.layer = null; save(); renderAll(); break;
      case "img-save": drawImage().toBlob(function (bl) { download(bl, fileBase() + ".png"); }); break;
      case "img-copy":
        var msg = $("img-msg"); msg.textContent = "";
        try {
          // Safari は Promise を渡す形でないと、クリック直後の扱いにならない
          var blob = new Promise(function (res) { drawImage().toBlob(res, "image/png"); });
          navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(toastCopied, function () { msg.textContent = Shell.t("t.copyFail"); });
        } catch (err) { msg.textContent = Shell.t("t.copyFail"); }
        break;
      case "exp":
        D.exported = Date.now(); save(false);
        var out = { app: "vernier-keybind-notes", v: 2, device: D.device, profiles: D.profiles };
        var dt = new Date(), z = function (n) { return ("0" + n).slice(-2); };
        download(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }), "numpad-notes-" + dt.getFullYear() + z(dt.getMonth() + 1) + z(dt.getDate()) + ".json");
        backupMsg(); break;
      case "imp": $("impfile").value = ""; $("impfile").click(); break;
    }
  });
  var rsTimer = 0;
  window.addEventListener("resize", function () { clearTimeout(rsTimer); rsTimer = setTimeout(renderPad, 80); });

  Shell.init({
    id: "keybind-notes",
    strings: {
      en: {
        "t.title": "Numpad shortcut notes",

        "t.base": "No modifier", "t.layerMenu": "Layers", "t.addLayer": "Add {m} layer", "t.rmLayer": "Remove {m} layer",
        "t.allLayers": "All layers added.",
        "t.edit": "Edit layout", "t.done": "Done",
        "t.hint": "Click a key — or press it on your numpad — to note what it does. Hold Shift, Ctrl, Alt or Cmd to jump to that layer.",
        "t.hintEdit": "Drag keys to move them and the blue handle to resize. Click an empty slot to add a key.",
        "t.gKey": "Key", "t.gKeyEdit": "Key layout", "t.gDevice": "Numpad", "t.gApp": "App", "t.gImage": "Image", "t.gBackup": "Backup",
        "t.unassigned": "Not assigned", "t.keyN": "Key “{k}”", "t.detected": "Detected as {c}", "t.noCode": "No physical key registered",
        "t.action": "What it does", "t.actionPh": "e.g. Play / Stop", "t.color": "Color", "t.noColor": "No color", "t.colorN": "Color {n}",
        "t.legend": "Legend", "t.physKey": "Physical key", "t.capture": "Press to detect", "t.capturing": "Press the key…",
        "t.width": "Width", "t.height": "Height", "t.move": "Move", "t.delKey": "Delete this key", "t.addHere": "Add a key here",
        "t.preset": "Preset", "t.presetPick": "Replace with…", "t.pre17": "17 keys (standard)", "t.pre21": "21 keys (Esc, Tab, =, ⌫ on top)",
        "t.pre22": "22 keys (Esc, Calc, Tab, = on top)", "t.confirmPreset": "Replace the current layout with this preset? Notes on keys that remain are kept.",
        "t.shape": "Key shape", "t.square": "Rounded", "t.round": "Round", "t.body": "Body",
        "t.editNote": "The layout is shared by every app. Browsers cannot see some keys (such as Calc, or keys the system takes first); you can still note them by clicking.",
        "t.imgWhat": "Include", "t.imgCur": "This layer", "t.imgAll": "All", "t.imgBg": "Background", "t.light": "Light", "t.dark": "Dark",
        "t.imgCopy": "Copy image", "t.imgSave": "Save PNG", "t.copyFail": "This browser could not copy the image. Use “Save PNG” instead.",
        "t.storeNote": "Notes are saved in this browser only; clearing site data erases them. Export a backup now and then. Importing adds the apps in the file and never deletes yours.",
        "t.export": "Export", "t.import": "Import",
        "t.never": "Not exported yet.", "t.lastExport": "Last exported {d}.", "t.changedSince": "Changed since then.",
        "t.imported": "Imported {n} app(s).", "t.importFail": "That file could not be read as numpad notes.",
        "t.confirmDel": "Delete “{n}”?", "t.confirmRmLayer": "Remove the {n} layer and its notes?",
        "t.sampleName": "DAW (example)", "t.s0": "Play", "t.s1": "Copy", "t.s2": "Paste", "t.s4": "Bounce"
      },
      ja: {
        "t.title": "テンキー割り当てメモ",
        "t.desc": "テンキーを左手デバイスとして使うときの、ソフトごとのキーの割り当てをメモ。画像にしてメモアプリに貼り付けられます。",
        "t.pAdd": "ソフトを追加", "t.pDup": "このソフトを複製", "t.pDel": "このソフトを削除", "t.appName": "名前", "t.untitled": "名前なし", "t.newApp": "新しいソフト", "t.copySuffix": "のコピー",
        "t.base": "単体", "t.layerMenu": "レイヤー", "t.addLayer": "{m} のレイヤーを追加", "t.rmLayer": "{m} のレイヤーを削除",
        "t.allLayers": "すべてのレイヤーを追加済みです。",
        "t.edit": "配列を編集", "t.done": "完了",
        "t.hint": "キーをクリックするか、実機のテンキーを押すと、機能をメモできます。Shift・Ctrl・Alt・Cmd を押しながらだと、そのレイヤーに切り替わります。",
        "t.hintEdit": "キーをドラッグで移動、青い丸をドラッグで大きさを変更できます。空いたマスをクリックするとキーを追加します。",

        "t.unassigned": "未設定", "t.keyN": "「{k}」キー", "t.detected": "認識されるキー: {c}", "t.noCode": "実機のキーは未登録",
        "t.action": "機能", "t.actionPh": "例: 再生／停止", "t.color": "色", "t.noColor": "色なし", "t.colorN": "色 {n}",
        "t.legend": "刻印", "t.physKey": "実機のキー", "t.capture": "押して登録", "t.capturing": "キーを押してください…",
        "t.width": "幅", "t.height": "高さ", "t.move": "移動", "t.delKey": "このキーを削除", "t.addHere": "ここにキーを追加",
        "t.preset": "プリセット", "t.presetPick": "選んで置き換え…", "t.pre17": "17キー（標準）", "t.pre21": "21キー（上段 Esc・Tab・=・⌫）",
        "t.pre22": "22キー（上段 Esc・電卓・Tab・=）", "t.confirmPreset": "今の配列をこのプリセットに置き換えますか？ 残るキーのメモはそのまま使えます。",
        "t.shape": "キーの形", "t.square": "角丸", "t.round": "丸", "t.body": "本体の色",
        "t.editNote": "配列はすべてのソフトで共通です。電卓キーや OS が先に使うキーなど、ブラウザが受け取れないキーもあります。その場合もクリックすればメモできます。",
        "t.imgWhat": "内容", "t.imgCur": "このレイヤー", "t.imgAll": "すべて", "t.imgBg": "背景", "t.light": "明るい", "t.dark": "暗い",
        "t.imgCopy": "画像をコピー", "t.imgSave": "PNG を保存", "t.copyFail": "このブラウザでは画像をコピーできませんでした。「PNG を保存」を使ってください。",
        "t.storeNote": "メモはこのブラウザの中にだけ保存され、サイトのデータを消去すると消えます。ときどき書き出してください。読み込みはソフトを追加するだけで、今のデータは消えません。",
        "t.export": "書き出し", "t.import": "読み込み",
        "t.never": "まだ書き出していません。", "t.lastExport": "最後の書き出し: {d}", "t.changedSince": "（その後に変更あり）",
        "t.imported": "{n} 件のソフトを読み込みました。", "t.importFail": "このファイルはテンキー割り当てメモとして読み込めませんでした。",
        "t.confirmDel": "「{n}」を削除しますか？", "t.confirmRmLayer": "{n} のレイヤーと、その中のメモを削除しますか？",
        "t.sampleName": "DAW（例）", "t.s0": "再生", "t.s1": "コピー", "t.s2": "ペースト", "t.s4": "バウンス"
      }
    },
    onSettingsChange: function () { if (D) renderAll(); }
  });

  // 初期化（サンプルの文言に Shell.t を使うため init の後）
  try { D = migrate(JSON.parse(localStorage.getItem(STORE))); } catch (e) { D = null; }
  if (!D) { var sp = sample(); D = { v: 2, device: { preset: "17", shape: "square", color: "dark", keys: makeKeys("17") }, active: sp.id, profiles: [sp], exported: 0, changed: 0 }; }
  save(false);
  try { var im = JSON.parse(localStorage.getItem(STORE + ".img")); if (im) { if (im.img === "all") S.img = "all"; if (im.bg === "dark") S.bg = "dark"; } } catch (e) {}
  document.querySelectorAll("[data-i18n-title]").forEach(function (el) { el.title = Shell.t(el.getAttribute("data-i18n-title")); el.setAttribute("aria-label", el.title); });
  renderAll();
})();
